<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторная работа 2 — Вариант 22722</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <span>Сенбете Улфинан Ассефа</span>
        <span>P3232</span>
        <span>Вариант 22722</span>
    </header>

    <div class="main">
        <div class="graph">
            <canvas id="canvas" width="400" height="400"></canvas>
        </div>

        <form id="point-form">
            <div class="field">
                <label>X (-5 … 5):</label>
                <input type="text" id="x-input" placeholder="например, 1.5">
            </div>

            <div class="field">
                <label>Y:</label>
                <div id="y-radios" class="radio-group">
                    <!-- Radio buttons for Y: -3, -2, -1, 0, 1, 2, 3, 4, 5 -->
                </div>
            </div>

            <div class="field">
                <label>R:</label>
                <div id="r-radios" class="radio-group">
                    <!-- Radio buttons for R: 1, 1.5, 2, 2.5, 3 -->
                </div>
            </div>

            <div id="error"></div>
            <button type="submit">проверить</button>
        </form>
    </div>

    <div class="results">
        <table id="results-table">
            <thead>
                <tr>
                    <th>X</th>
                    <th>Y</th>
                    <th>R</th>
                    <th>Результат</th>
                    <th>Время</th>
                    <th>Время работы</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
