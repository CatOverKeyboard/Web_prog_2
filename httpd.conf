# Apache httpd config for Lab 2 — Helios
# ==========================================
# CHANGE THESE before using:
#   YOUR_PORT     — any free port for Apache (e.g., 18080)
#   FCGI_PORT     — any free port for Java FastCGI (e.g., 18081)
#   YOUR_USERNAME — your Helios username (e.g., s503337)
# ==========================================

ServerRoot "/usr/local/apache2"
Listen YOUR_PORT
ServerName localhost

# Load required modules
LoadModule mpm_prefork_module modules/mod_mpm_prefork.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_fcgi_module modules/mod_proxy_fcgi.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule log_config_module modules/mod_log_config.so

# MIME types
TypesConfig conf/mime.types

# Pid and log files in your home directory
PidFile "/home/YOUR_USERNAME/lab2/httpd.pid"
ErrorLog "/home/YOUR_USERNAME/lab2/error.log"

# Serve static files (HTML, CSS, JS)
DocumentRoot "/home/YOUR_USERNAME/lab2/web"
DirectoryIndex index.html

<Directory "/home/YOUR_USERNAME/lab2/web">
    Require all granted
</Directory>

# Proxy /api/check to Java FastCGI server
ProxyPass "/api/check" "fcgi://localhost:FCGI_PORT/"
ProxyPassReverse "/api/check" "fcgi://localhost:FCGI_PORT/"
